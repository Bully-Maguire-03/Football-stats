<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PitchRank | Football Analytics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand-mark">⚽</div>
          <div class="brand-copy">
            <span class="eyebrow">PitchRank</span>
            <h1>Football Analytics</h1>
          </div>
        </div>

        <nav class="main-nav" aria-label="Main navigation">
          <button class="nav-btn active" data-panel="rankings">Rankings</button>
          <button class="nav-btn" data-panel="players">Players</button>
          <button class="nav-btn" data-panel="events">Events</button>
          <button class="nav-btn" data-panel="suggestions">Suggestions</button>
          <button class="nav-btn" id="adminToggleBtn">Admin</button>
        </nav>

        <div class="user-panel">
          <div id="userBadge" class="user-badge"></div>
        </div>
      </header>

      <main class="main-content">
        <section id="rankingsPanel" class="panel-section active">
          <div class="toolbar card-surface">
            <input id="searchInput" type="text" placeholder="Search player..." />
            <select id="positionFilter">
              <option value="">All positions</option>
              <option value="GK">Goalkeepers</option>
              <option value="DF">Defenders</option>
              <option value="MF">Midfielders</option>
              <option value="AT">Attackers</option>
            </select>
            <select id="sortFilter">
              <option value="points">Top points</option>
              <option value="name">Name</option>
              <option value="club">Club</option>
            </select>
          </div>

          <div id="summaryTiles" class="summary-tiles"></div>
          <div id="overallLeaderboard" class="overall-board card-surface"></div>
          <div id="positionBoards" class="position-grid"></div>
        </section>

        <section id="playersPanel" class="panel-section hidden">
          <div class="card-surface profile-shell">
            <div class="profile-header">
              <div>
                <div class="eyebrow muted">Player view</div>
                <h2>My profile</h2>
              </div>
              <span id="profileStatus" class="status-pill neutral">Signed out</span>
            </div>

            <div id="profileCard" class="profile-card"></div>

            <div class="profile-grid">
              <div class="mini-panel">
                <h3>Player stats</h3>
                <div id="playerStatsGrid" class="stats-grid"></div>
              </div>

              <div class="mini-panel">
                <h3>Suggestion / request</h3>
                <form id="suggestionForm" class="suggestion-form">
                  <textarea id="suggestionInput" placeholder="Explain a stat issue, bug, or requested app feature..."></textarea>
                  <button type="submit" class="primary-btn">Send suggestion</button>
                </form>
                <div id="sentSuggestions" class="suggestions-list"></div>
              </div>
            </div>
          </div>
        </section>

        <section id="eventsPanel" class="panel-section hidden">
          <div class="card-surface wide-panel">
            <div class="section-title-row">
              <h2>Match Event Logger</h2>
              <span class="chip">Coach control</span>
            </div>

            <div class="event-form">
              <div class="field-wrap">
                <label>Player</label>
                <select id="eventPlayerSelect"></select>
              </div>
              <div class="field-wrap">
                <label>Event</label>
                <select id="eventTypeSelect"></select>
              </div>
              <div class="field-wrap">
                <label>Quantity</label>
                <input id="eventQuantity" type="number" min="1" value="1" />
              </div>
              <div class="field-wrap action-wrap">
                <label class="ghost">Apply</label>
                <button id="applyEventBtn" class="primary-btn">Apply Event</button>
              </div>
            </div>

            <div id="historyList" class="history-list"></div>
          </div>
        </section>

        <section id="suggestionsPanel" class="panel-section hidden">
          <div class="card-surface wide-panel">
            <div class="section-title-row">
              <h2>Suggestions inbox</h2>
              <span class="chip accent">Community</span>
            </div>
            <div id="publicSuggestions" class="public-suggestions"></div>
          </div>
        </section>
      </main>
    </div>

    <aside id="authModal" class="modal hidden" aria-modal="true" role="dialog">
      <div class="modal-card">
        <div class="modal-header">
          <h3>Sign in</h3>
          <button id="closeAuthModal" class="close-btn" aria-label="Close sign in">×</button>
        </div>

        <div class="auth-box">
          <button id="googleSignInBtn" class="google-btn">Continue with Google</button>
          <div class="divider"><span>or use email</span></div>

          <label>
            <span>Full name</span>
            <input id="authNameInput" type="text" placeholder="Your name" />
          </label>

          <label>
            <span>Email</span>
            <input id="authEmailInput" type="email" placeholder="you@example.com" />
          </label>

          <label>
            <span>Linked player</span>
            <input id="authPlayerInput" type="text" placeholder="Optional player name" />
          </label>

          <button id="submitAuthBtn" class="primary-btn wide-btn">Continue</button>
        </div>
      </div>
    </aside>

    <aside id="adminPanel" class="admin-panel hidden">
      <div class="admin-header">
        <h3>Admin Controls</h3>
        <button id="closeAdminPanelBtn" class="close-btn" aria-label="Close admin panel">×</button>
      </div>

      <div class="admin-auth-box">
        <label>
          <span>Admin email</span>
          <input id="adminEmailInput" type="email" placeholder="mohammedakhsar2020@gmail.com" />
        </label>
        <button id="unlockAdminBtn" class="primary-btn">Unlock admin</button>
      </div>

      <div id="adminEditor" class="admin-editor hidden">
        <div class="field-wrap compact-field">
          <label>Player</label>
          <select id="adminPlayerSelect"></select>
        </div>

        <div id="adminPlayerForm" class="admin-player-form"></div>
        <button id="saveAdminPlayerBtn" class="primary-btn w-full">Save player</button>

        <div class="claimed-section">
          <h4>Claimed accounts</h4>
          <div id="claimedPlayersList" class="claimed-list"></div>
        </div>
      </div>
    </aside>

    <div id="playerModal" class="player-modal hidden" tabindex="-1">
      <div class="player-modal-card">
        <div class="modal-header">
          <h3 id="playerModalTitle">Player details</h3>
          <button id="closePlayerModal" class="close-btn" aria-label="Close player details">×</button>
        </div>
        <div id="playerModalContent" class="player-modal-content"></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
