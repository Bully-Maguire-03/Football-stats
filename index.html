<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PitchRank | Football Stats</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><header class="header"><div><div class="eyebrow">PitchRank</div><h1>⚽ Football Player Rankings</h1><p>Rank players by match performance</p></div><nav><button data-tab="rankings">Rankings</button><button data-tab="events">Match Events</button><button data-tab="player">My Stats</button><button data-tab="history">History</button><button id="settingsBtn">⚙ Settings</button><button id="adminBtn">Admin</button></nav></header><aside id="settings" class="drawer"><button class="close" data-close="settings">×</button><h2>Settings</h2><label>Light theme <input id="theme" type="checkbox"></label><label>Background color <input id="bg" type="color" value="#0b1220"></label><label>Background image URL <input id="bgImage" type="url" placeholder="https://..."></label><button id="applyBg">Apply background</button><hr><h3>Music player</h3><input id="musicUrl" placeholder="Direct .mp3/.wav URL"><button id="loadMusic">Load music</button><audio id="audio" controls></audio></aside><aside id="admin" class="drawer"><button class="close" data-close="admin">×</button><h2>Admin panel</h2><input id="adminEmail" type="email" placeholder="yourname@gmail.com"><button id="unlock">Unlock editing</button><div id="editor" class="hidden"><select id="playerSelect"></select><div id="form"></div><button id="save">Save player</button><h3>Claim status</h3><div id="claims"></div></div></aside><main><section id="rankings" class="tab"><div class="tools"><input id="search" placeholder="Search player..."><select id="position"><option value="">All positions</option><option>GK</option><option>DF</option><option>MF</option><option>AT</option></select></div><div id="summary" class="summary"></div><div id="grid" class="grid"></div></section><section id="events" class="tab hidden panel"><h2>⚡ Match Event Logger</h2><div class="event-form"><select id="eventPlayer"></select><select id="eventType"></select><input id="quantity" type="number" min="1" value="1"><button id="apply">Apply event</button></div></section><section id="player" class="tab hidden panel"><h2>🧑 My read-only stats</h2><div id="claim"></div><div id="dashboard"></div></section><section id="history" class="tab hidden panel"><h2>📋 Match history</h2><div id="historyList"></div></section></main><script src="script.js"></script></body></html>
